<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — Bitza</title>
<link rel="stylesheet" href="../../css/variables.css" />
<link rel="stylesheet" href="../../css/style.css" />
<link rel="stylesheet" href="../../css/components.css" />
<link rel="stylesheet" href="../../css/pages.css" />
</head>
<body>

<header class="topbar">
  <a href="../../index.html" class="icon-btn" aria-label="Back">
    <i data-lucide="arrow-left"></i>
  </a>
  <a href="../../index.html" class="logo logo-center">
    <span class="logo-mark">B</span>
    <span class="logo-text">Bit<em>za</em></span>
  </a>
  <div class="topnav-right"></div>
</header>

<main class="auth-wrap">
  <div class="auth-card" id="loginView">
    <h2>Welcome back</h2>
    <p class="muted">Sign in to save items, chat with sellers, and manage your listings.</p>
    <label class="auth-label">Email</label>
    <input type="email" placeholder="you@example.com" />
    <label class="auth-label">Password</label>
    <input type="password" placeholder="••••••••" />
    <button class="btn primary full">Sign In</button>
    <p class="muted small auth-switch">New here? <a href="#" id="showSignup">Create an account</a></p>
  </div>

  <div class="auth-card" id="signupView" style="display:none">
    <h2>Create your account</h2>
    <p class="muted">Join Bitza — it's free.</p>
    <label class="auth-label">Full name</label>
    <input type="text" placeholder="Ada Obi" />
    <label class="auth-label">Email</label>
    <input type="email" placeholder="you@example.com" />
    <label class="auth-label">Phone</label>
    <input type="tel" placeholder="+234 800 000 0000" />
    <label class="auth-label">Password</label>
    <input type="password" placeholder="Create a password" />
    <label class="auth-label">Confirm password</label>
    <input type="password" placeholder="Confirm password" />
    <button class="btn primary full">Create Account</button>
    <p class="muted small auth-switch">Already have an account? <a href="#" id="showLogin">Sign in</a></p>
  </div>
</main>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof lucide !== 'undefined') lucide.createIcons();
    const loginView = document.getElementById('loginView');
    const signupView = document.getElementById('signupView');
    document.getElementById('showSignup').onclick = (e) => {
      e.preventDefault();
      loginView.style.display = 'none';
      signupView.style.display = 'block';
    };
    document.getElementById('showLogin').onclick = (e) => {
      e.preventDefault();
      signupView.style.display = 'none';
      loginView.style.display = 'block';
    };
  });
</script>
<script src="../../js/theme.js"></script>
</body>
</html>
